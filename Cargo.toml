[package]
name = "lead-build"
version = "0.8.4"
edition = "2024"
license = "GPL-2.0-only"
keywords = ["build", "ninja"]
authors = ["Max Sikström <max@pengi.se>"]
description = "Configuration language for declarative builds"
documentation = "https://lead-build.readthedocs.io/en/latest/"
repository = "https://github.com/lead-build/lead-build"

[lib]

[[bin]]
name = "pb"

[[bin]]
name = "pbfmt"

[build-dependencies]
lalrpop = { version = "0.23.1" }

[dependencies]
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.11"
lalrpop-util = { version = "0.23.1", features = ["lexer", "unicode"] }
log = "0.4.33"
logos = "0.16.1"
logos-display = "0.1.3"
pathdiff = "0.2.3"
pretty = "0.12.5"
rowan = "0.17.0"
strum = { version = "0.28.0", features = ["derive"] }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
