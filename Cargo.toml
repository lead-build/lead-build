[package]
name = "lead-build"
version = "0.8.15"
edition = "2024"
license = "GPL-2.0-only"
keywords = ["build", "ninja"]
authors = ["Max Sikström <max@pengi.se>"]
description = "Configuration language for declarative builds"
documentation = "https://lead.readthedocs.io/"
repository = "https://github.com/lead-build/lead-build"

[lib]

[[bin]]
name = "pb"

[[bin]]
name = "pbfmt"

[[bin]]
name = "pbls"

[package.metadata.deb]
section = "devel"
extended-description = """\
The Lead Build System is a declarative build system. This package contains \
pb, which generates Ninja build files from a build description, pbfmt, a \
formatter for build descriptions, and pbls, a language server."""
license-file = ["LICENSE", "0"]
assets = [
    ["target/release/pb", "usr/bin/", "755"],
    ["target/release/pbfmt", "usr/bin/", "755"],
    ["target/release/pbls", "usr/bin/", "755"],
    ["README.md", "usr/share/doc/lead-build/", "644"],
    ["target/man/pb.1.gz", "usr/share/man/man1/", "644"],
    ["target/man/pbfmt.1.gz", "usr/share/man/man1/", "644"],
    ["target/man/pbls.1.gz", "usr/share/man/man1/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/pb", dest = "/usr/bin/pb", mode = "755" },
    { source = "target/release/pbfmt", dest = "/usr/bin/pbfmt", mode = "755" },
    { source = "target/release/pbls", dest = "/usr/bin/pbls", mode = "755" },
    { source = "LICENSE", dest = "/usr/share/licenses/lead-build/LICENSE", mode = "644", doc = true },
    { source = "README.md", dest = "/usr/share/doc/lead-build/README.md", mode = "644", doc = true },
    { source = "target/man/pb.1.gz", dest = "/usr/share/man/man1/pb.1.gz", mode = "644", doc = true },
    { source = "target/man/pbfmt.1.gz", dest = "/usr/share/man/man1/pbfmt.1.gz", mode = "644", doc = true },
    { source = "target/man/pbls.1.gz", dest = "/usr/share/man/man1/pbls.1.gz", mode = "644", doc = true },
]

[build-dependencies]
lalrpop = { version = "0.23.1" }

[dependencies]
annotate-snippets = "0.12.18"
clap = { version = "4.6.1", features = ["derive"] }
env_logger = "0.11.11"
globset = "0.4.20"
lalrpop-util = { version = "0.23.1", features = ["lexer", "unicode"] }
log = "0.4.33"
logos = "0.16.1"
logos-display = "0.1.3"
pathdiff = "0.2.3"
pretty = "0.12.5"
rowan = "0.17.0"
strum = { version = "0.28.0", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "io-std", "net"] }
tower-lsp = "0.20.0"

[dev-dependencies]
clap_mangen = "0.3.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
