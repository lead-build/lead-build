name: CI

# Tests and packages are built for every push and pull request. A pushed
# version tag also publishes, once both have passed. Pull requests never have
# a tag as ref, and pushing a tag requires write access to the repository.
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Check tag matches Cargo.toml version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose

  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the oldest supported Ubuntu, so the glibc requirement
          # covers Ubuntu 22.04+, Mint 21+, Debian 12+ and Raspberry Pi OS 12+.
          - name: deb-amd64
            kind: deb
            os: ubuntu-22.04
          - name: deb-arm64
            kind: deb
            os: ubuntu-22.04-arm
          - name: rpm-alma9-x86_64
            kind: rpm
            os: ubuntu-latest
            container: almalinux:9
          - name: rpm-alma9-aarch64
            kind: rpm
            os: ubuntu-24.04-arm
            container: almalinux:9
    name: package (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    steps:
      - name: Install build tools
        if: matrix.container
        run: dnf install -y gcc git gzip
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - name: Generate man pages
        run: |
          cargo run --release --example mangen -- target/man
          gzip -9nf target/man/*.1
      - name: Build deb
        if: matrix.kind == 'deb'
        run: |
          cargo install --locked cargo-deb
          cargo deb
          mkdir -p dist && cp target/debian/*.deb dist/
      - name: Build rpm
        if: matrix.kind == 'rpm'
        run: |
          cargo install --locked cargo-generate-rpm
          cargo build --release
          cargo generate-rpm
          mkdir -p dist && cp target/generate-rpm/*.rpm dist/
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.name }}
          path: dist/
          if-no-files-found: error

  publish-crates:
    needs: [test, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish
        run: cargo publish --verbose
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-github:
    needs: [test, package]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true
